name: PR Full Debug Build

on:
  # Isolated feature-branch CI: registers and validates this fork without touching cmp-rewrite.
  push:
    branches:
      - feature/addon-latency
      - feature/addon-latency-v2
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [cmp-rewrite]
  workflow_dispatch:

permissions:
  contents: read

# Official Nuvio Cloud public client configuration, published by NuvioMedia/self-host.
# Publishable API keys are client-visible by design; never use service_role or secret keys here.
env:
  NUVIO_SUPABASE_URL: "https://api.nuvio.tv"
  NUVIO_SUPABASE_ANON_KEY: "sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN"

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Validate account backend configuration
        run: |
          test -n "$NUVIO_SUPABASE_URL"
          test -n "$NUVIO_SUPABASE_ANON_KEY"
          case "$NUVIO_SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *) echo "Invalid Nuvio client publishable key" >&2; exit 1 ;;
          esac
          echo "Nuvio public client configuration is present."

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
